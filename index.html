<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sweet Cascade — Match & Win</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game" inert><div class="backdrop"></div><div class="frost"></div><div class="host" aria-hidden="true"><img src="public/candy-king.png" alt=""></div>
<header><button id="settings" aria-label="Settings">⚙</button><button id="sound" aria-label="Sound">♫</button><span class="demo">DEMO · 18+</span></header>
<div class="brand"><img src="public/logo.png" alt="Sweet Cascade — Match & Win"></div>
<section class="play"><div class="score"><div><small id="win-label">WIN</small><strong id="win">0,00</strong></div><b id="mult">1×</b></div><div id="board"></div><div id="message">MATCH 3 OR MORE</div></section>
<aside><div class="balance"><small>BALANCE</small><strong id="balance">10 000,00</strong></div><div class="meter-box"><h3 id="meter-title">ICE BONUS</h3><div id="meter"><i></i><i></i><i></i></div><span id="moves-label">Collect 3 magic candies</span></div><button class="bonus-button" id="bonus"><span>🍭</span>BONUSES</button><div class="betbox"><span>BET</span><strong id="bet">1,00</strong><small id="cost">1,00 per move</small></div><div class="controls"><button id="minus" aria-label="Decrease bet">−</button><button id="plus" aria-label="Increase bet">+</button><button id="turbo" aria-label="Turbo">ϟ</button><button id="auto" aria-label="Autoplay">▷</button></div><button id="play" class="play-button">PLAY <span>↻</span></button><small class="space-hint">or hold SPACE</small></aside>
<footer><span id="mode">NORMAL PLAY</span><button id="history">History</button><button id="rules">Rules ⓘ</button><span id="connection">● Demo credits</span></footer>
</main><dialog id="dialog"><button id="close" aria-label="Close">×</button><div id="dialog-content"></div></dialog><div id="toast" role="status"></div>
<div id="rgs-status" role="alertdialog" aria-modal="true" aria-labelledby="rgs-title"><div><h2 id="rgs-title">CONNECTING</h2><p>Loading your board from the test server…</p><button id="rgs-reload" hidden>RELOAD</button></div></div>
<script src="public/vendor/pixi.min.js"></script><script type="module" src="app.js"></script></body></html>
